# ─────────────────────────────────────────────────────────────────────────────
# Sri Lanka Facility Registry IG — Tenant Configuration
# IG: https://ig.hiu.lk/fhir/facilityregistry/
#
# Differences from mCSD defaults:
#   - Only 3 resources: Organization, Location, HealthcareService
#   - Endpoint and OrganizationAffiliation are excluded (not in LK-FR scope)
#   - Profile URLs follow https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/
#   - ITI-130 (feed/create/update/delete) is enabled
# ─────────────────────────────────────────────────────────────────────────────
[wso2.FRCoreService.fhir_utils.igConfig]
id = "lk-fr"
name = "Sri Lanka HIU Facility Registry v0.1.0"
canonical = "https://ig.hiu.lk/fhir/facilityregistry"
fhirVersion = "4.0.1"
serverName = "LKFacilityRegistryCapabilityStatement"
serverVersion = "0.1.0"
publisher = "Health Informatics Unit — Ministry of Health Sri Lanka"
instantiates = ["https://profiles.ihe.net/ITI/mCSD/CapabilityStatement/IHE.mCSD.CareServicesSelectiveSupplier"]

[wso2.FRCoreService.fhir_utils.igConfig.transactions]
iti90 = true
iti91 = true
iti130 = true

[[wso2.FRCoreService.fhir_utils.igConfig.resources]]
resourceType = "Organization"
profile = "https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/LKOrganization"
facilityProfile = "https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/LKFacilityOrganization"
jurisdictionProfile = "https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/LKJurisdictionOrganization"
interactions = ["read", "search-type", "create", "update", "delete"]
supportsHistory = true

[[wso2.FRCoreService.fhir_utils.igConfig.resources]]
resourceType = "Location"
profile = "https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/LKLocation"
facilityProfile = "https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/LKFacilityLocation"
jurisdictionProfile = "https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/LKJurisdictionLocation"
interactions = ["read", "search-type", "create", "update", "delete"]
supportsHistory = true

[[wso2.FRCoreService.fhir_utils.igConfig.resources]]
resourceType = "HealthcareService"
profile = "https://ig.hiu.lk/fhir/facilityregistry/StructureDefinition/LKHealthcareService"
interactions = ["read", "search-type", "create", "update", "delete"]
supportsHistory = true
